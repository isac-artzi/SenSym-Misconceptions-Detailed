[project]
name = "sensym-misconceptions-detailed"
version = "0.2.0"
description = "Can a small local LLM detect cybersecurity misconceptions in student responses, and does telling it what to look for help?"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Lets `pytest` find the modules without any path juggling, from the repo root.
[tool.pytest.ini_options]
pythonpath = ["python/misconception"]
testpaths = ["python/tests"]
addopts = "-q"
